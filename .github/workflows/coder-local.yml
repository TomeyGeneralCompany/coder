name: Coder local Qwen adapter checks
on:
  pull_request:
    paths:
      - 'software-agent-sdk-main/coder_local/**'
      - '.github/workflows/coder-local.yml'
  push:
    branches: [coder-local-qwen-stage-gates, coder-harden-provider-stages-checkpoints-scope-verification]
    paths:
      - 'software-agent-sdk-main/coder_local/**'
      - '.github/workflows/coder-local.yml'
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check local runtime
        run: python -m compileall -q software-agent-sdk-main/coder_local
      - name: Test native adapter and controller
        working-directory: software-agent-sdk-main
        run: python -m unittest -v coder_local.test_local coder_local.test_server coder_local.test_controller_flow coder_local.test_hardening
  sdk-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install uv
        run: python -m pip install uv
      - name: Install pinned SDK dependencies
        working-directory: software-agent-sdk-main
        run: uv sync --frozen --no-dev
      - name: Test actual SDK local-only transport
        working-directory: software-agent-sdk-main
        env:
          ALLOW_SHORT_CONTEXT_WINDOWS: '1'
          DO_NOT_TRACK: '1'
        run: uv run --no-sync python -m unittest -v coder_local.test_sdk_integration
