name: One-time native Coder lock regeneration
on:
  push:
    branches: [coder-native-ollama-remove-litellm]
    paths:
      - 'software-agent-sdk-main/pyproject.toml'
      - 'software-agent-sdk-main/openhands-sdk/pyproject.toml'
      - 'software-agent-sdk-main/openhands-tools/pyproject.toml'
      - '.github/workflows/coder-native-lock.yml'
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install uv
        run: python -m pip install uv
      - name: Generate lock after removing LiteLLM
        working-directory: software-agent-sdk-main
        run: uv lock
      - name: Commit refreshed lockfile
        run: |
          git config user.name "coder-native-ci"
          git config user.email "coder-native-ci@users.noreply.github.com"
          git add -- software-agent-sdk-main/uv.lock
          if ! git diff --cached --quiet; then
            git commit -m "Resolve SDK dependencies without direct LiteLLM"
            git push origin HEAD:coder-native-ollama-remove-litellm
          fi
