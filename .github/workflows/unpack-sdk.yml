name: Extract supplied SDK ZIP
on:
  push:
    branches: [unpack-software-agent-sdk]
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract ZIP and commit only extracted contents
        run: |
          set -eu
          unzip -q -o software-agent-sdk-main.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git rm -f .github/workflows/unpack-sdk.yml
          git commit -m "Extract software-agent-sdk-main.zip"
          git push origin HEAD:unpack-software-agent-sdk
